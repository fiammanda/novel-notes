<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
    <title>建自用扫文站后我再也不文荒了</title>
    <meta name="author" content="fiammanda" />
    <meta name="description" content="自用扫文站" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://rsms.me/" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fontsapi.zeoseven.com/" crossorigin="anonymous" />
    <link rel="preload" href="https://fontsapi.zeoseven.com/482/main/result.css" as="style" onload="this.rel='stylesheet'" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script src="/data.js"></script>
    <script src="/script.js" defer></script>
    <script src="https://fastly.jsdelivr.net/npm/gsap/dist/gsap.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/gsap/dist/Flip.min.js"></script>
  </head>
  <body>
    <div id="loading">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="spinner">
        <circle cx="12" cy="12" r="9" />
      </svg>
    </div>
    <div id="app" class="hidden instant">
      <header id="header">
        <h1><span>建自用<strong>扫文站</strong>后</span><span>我再也不文荒了</span></h1>
        <p>骗你的</p>
      </header>
      <section id="widget">
        <button command="show-modal" commandfor="dialog">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 10V7a4 4 0 1 1 8 0v3" />
            <path d="M5 10h14v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" />
          </svg>
        </button>
        <a href="/">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5 L12 19" />
            <path d="M5 12 L19 12" />
            <path d="M5 12 L19 12" />
            <path d="M5 12 L19 12" />
          </svg>
        </a>
      </section>
      <form id="filter" autocomplete="off">
        <div class="select" tabindex="0">
          <span role="combobox" aria-label="更新" data-key="update" data-dir="dsc" data-name="sort">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25">
              <path d="M3 5h18" />
              <path d="M15 12H3" />
              <path d="M9 19H3" />
            </svg>
          </span>
          <ul role="listbox">
            <li role="option" data-key="update" data-dir="dsc" aria-selected="true">更新</li>
            <li role="option" data-key="update" data-dir="asc" aria-selected="false">更新</li>
            <li role="option" data-key="post" data-dir="dsc" aria-selected="false">录入</li>
            <li role="option" data-key="post" data-dir="asc" aria-selected="false">录入</li>
            <li role="option" data-key="rating" data-dir="dsc" aria-selected="false">评分</li>
            <li role="option" data-key="rating" data-dir="asc" aria-selected="false">评分</li>
          </ul>
        </div>
        <fieldset>
          <label>
            <input name="search" type="text" placeholder="书名 作者 简介" />
            <span class="label" aria-label="书名 作者 简介">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25">
                <path d="m21 21l-4.343-4.343m0 0A8 8 0 1 0 5.343 5.343a8 8 0 0 0 11.314 11.314" />
              </svg>
            </span>
          </label>
          <div class="select" tabindex="0">
            <span role="combobox" aria-placeholder="状态" data-name="status"></span>
            <ul role="listbox">
              <li role="option" aria-selected="true" aria-label="全部"></li>
              <li role="option" aria-selected="false">停更</li>
              <li role="option" aria-selected="false">连载</li>
              <li role="option" aria-selected="false">完结</li>
            </ul>
          </div>
          <div class="select" tabindex="0">
            <span role="combobox" aria-placeholder="进度" data-name="progress"></span>
            <ul role="listbox">
              <li role="option" aria-selected="true" aria-label="全部"></li>
              <li role="option" aria-selected="false">弃文</li>
              <li role="option" aria-selected="false">观望</li>
              <li role="option" aria-selected="false">追读</li>
              <li role="option" aria-selected="false">看完</li>
            </ul>
          </div>
          <button type="reset">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="m14.8 11.975l-1.425-1.425L16.95 6H8.825l-2-2H19q.625 0 .9.55t-.1 1.05zm-.8 4.85V19q0 .425-.288.713T13 20h-2q-.425 0-.712-.288T10 19v-6.175l-7.9-7.9q-.275-.275-.275-.687t.275-.713q.3-.3.713-.3t.712.3L20.5 20.5q.3.3.288.7t-.313.7q-.3.275-.7.288t-.7-.288zm-.625-6.275" />
            </svg>
          </button>
        </fieldset>
      </form>
      <form id="import">
        <textarea name="urls" placeholder=""></textarea>
        <footer>
          <button type="reset">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a9 9 0 1 1-5.657 2" />
              <path d="M3 4.5h4v4" />
            </svg>
          </button>
          <button type="submit">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9.8 21.75q-3.425-.775-5.613-3.5T2 12t2.188-6.25T9.8 2.25q.475-.125.838.175t.362.8q0 .35-.2.625t-.55.35Q7.5 4.825 5.75 7T4 12t1.75 5 4.5 2.8q.35.075.55.35t.2.625q0 .5-.362.8t-.838.175m4.4 0q-.475.125-.837-.175t-.363-.8q0-.35.2-.625t.55-.35q.675-.15 1.313-.413t1.212-.637q.275-.2.613-.15t.587.3q.35.35.3.813t-.45.737q-.725.45-1.513.775t-1.612.525m4.7-4.25q-.25-.25-.3-.587t.15-.613q.375-.575.638-1.225t.412-1.325q.075-.35.35-.537t.625-.188q.5 0 .8.363t.175.837q-.2.825-.525 1.613t-.775 1.512q-.275.4-.737.45t-.813-.3m1.875-6.5q-.35 0-.625-.2t-.35-.55q-.15-.675-.413-1.312t-.637-1.213q-.2-.3-.15-.637t.3-.588q.35-.35.813-.3t.737.475q.45.725.775 1.513T21.75 9.8q.125.475-.175.838t-.8.362m-4.5-5.75q-.575-.375-1.212-.638T13.75 4.2q-.35-.075-.55-.35t-.2-.625q0-.5.363-.8t.837-.175q.825.2 1.613.525t1.512.775q.425.275.475.738t-.3.812q-.25.25-.587.3t-.638-.15"/>
              <path d="m12.975 13.125 1.85-1.85q.3-.3.725-.3t.725.3.288.725-.313.725L12.675 16.3q-.275.275-.7.275t-.7-.275L7.65 12.65q-.3-.3-.288-.712t.313-.713.713-.3.712.3l1.875 1.9V8q0-.425.288-.712T11.975 7t.713.288.287.712z"/>
            </svg>
          </button>
        </footer>
      </form>
      <form id="save">
        <fieldset name="set"></fieldset>
        <footer>
          <button type="reset">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6z" />
            </svg>
          </button>
          <button type="submit" name="submit">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.815 3.585c.996-.36 1.96.604 1.6 1.6l-5.646 15.61c-.361 1-1.725 1.121-2.257.202l-2.982-5.15a1 1 0 0 0 .177-.139l5-5a1 1 0 0 0-1.414-1.414l-5 5a1 1 0 0 0-.14.176l-5.15-2.982c-.92-.532-.798-1.895.201-2.257z" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="spinner">
              <circle cx="12" cy="12" r="9" />
            </svg>
          </button>
        </footer>
      </form>
      <form id="view">
        <fieldset name="set" disabled></fieldset>
        <footer>
          <button type="reset">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <mask id="mask">
                <path fill="#fff" d="M0 0h24v24H0z" />
                <path stroke="#000" stroke-width="4" pathLength="1" d="m5 3.5 16 16" />
              </mask>
              <path fill="currentColor" mask="url(#mask)" d="M19.262 2.435a1.01 1.01 0 0 1 .944.454c.94 1.412.768 3.478-.285 4.795l-.002-.001c-.264.342-.647.657-1.012.919c-.439.316-.962.636-1.499.933c-.443.246-.91.484-1.363.699c.916.043 1.972.018 3.039-.137q-.06.151-.125.304c-.552 1.263-1.328 2.54-2.424 3.635c-2.05 2.05-4.74 2.992-6.843 3.431c-1.175.246-2.199.34-2.882.377l-.102.831c-.11.927-.17 1.898-.208 2.325c-.047.54-.448 1-1 1a1 1 0 0 1-1-1c0-.571.117-1.669.222-2.56c.204-1.731.445-3.426.986-5.09c.625-1.92 1.75-4.379 3.757-6.385c3.933-3.933 9.649-4.515 9.797-4.53" />
              <path stroke="currentColor" stroke-width="2" pathLength="1" d="M3.5 3.5 21 21" />
            </svg>
          </button>
          <button type="submit" name="submit">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.815 3.585c.996-.36 1.96.604 1.6 1.6l-5.646 15.61c-.361 1-1.725 1.121-2.257.202l-2.982-5.15a1 1 0 0 0 .177-.139l5-5a1 1 0 0 0-1.414-1.414l-5 5a1 1 0 0 0-.14.176l-5.15-2.982c-.92-.532-.798-1.895.201-2.257z" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="spinner">
              <circle cx="12" cy="12" r="9" />
            </svg>
          </button>
        </footer>
      </form>
      <main id="list">
        <ul></ul>
      </main>
      <div id="notice" role="status" class="hidden"></div>
      <dialog id="dialog">
        <form name="auth" class="hidden" autocomplete="off">
          <label>
            <input type="text" name="passcode" placeholder="口令" />
            <span class="label">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4.875 14.125Q4 13.25 4 12t.875-2.125T7 9t2.125.875T10 12t-.875 2.125T7 15t-2.125-.875M7 18q1.925 0 3.475-1.1T12.65 14H13l1.3 1.3q.15.15.325.212t.375.063t.375-.062t.325-.213L17 14l1.75 1.375q.15.125.338.187t.387.038t.363-.112t.287-.238l2.25-2.575q.125-.15.188-.325t.062-.375t-.075-.362t-.2-.288L21.325 10.3q-.15-.15-.337-.225T20.6 10h-7.95q-.6-1.7-2.113-2.85T7 6Q4.5 6 2.75 7.75T1 12t1.75 4.25T7 18" />
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="spinner">
                <circle cx="12" cy="12" r="9" />
              </svg>
            </span>
          </label>
        </form>
      </dialog>
    </div>
  </body>
</html>
