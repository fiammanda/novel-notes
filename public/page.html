      window.DATA = [{"id":"4b3f5ffff5","url":"https://fanqienovel.com/page/7387773539379579929","title":"开局成野神？我靠香火证道真神！","cover":null,"author":"吃个橘子","status":"连载","words":93.3,"genre":["玄幻","穿越","系统","无女主"],"summary":"【无女主+慢热】\n一场意外，宋玄清穿越到了一个仙人不存，神佛消散的诡异世界。\n　　这个世界妖邪横行，鬼祟食人，天下邪法猖獗，仙山神佛不存。\n　　妖魔猖狂，鬼祟作乱，还有邪法歪道食人炼丹，百姓人人自危。\n　　宋玄清穿越到这样一个危险的世界，成了一处小山村供奉的野神，修为微弱，势单力薄。\n　　好在，他绑定了香火成神证道系统，只要有足够的香火，他就能变强。\n　　修为、功法、仙器，甚至仙府神格。\n　　只要香火昌盛，唾手可得。\n　　（您庇护宋家村免受鬼祟侵害，香火值+100，奖励神道丹药。）\n　　（您庇护万安县免受妖邪屠戮，香火值+10000，奖励神道功法。）\n　　（您庇护盛国百姓安宁，得千万人香火供奉，奖励仙府神格。）\n　　从此，宋玄清开始了自己庇护一方，香火鼎盛的证道之路。","update":"2026-08-13T14:52:00+00:00","latest":"第四百五十五章 祈求赐见","rating":4,"review":"一直以为断更了但好像又在苟延残喘？基本没问题偶尔有地方感觉主角傲慢了点……","progress":"追读","post":"2026-08-08","edit":"2026-08-09"},{"id":"17ae26d1d2","url":"https://fanqienovel.com/page/7578774388464438296","title":"HP 西弗勒斯懒羊羊共闯魔法世界","cover":null,"author":"青瓜味的鸽子","status":"停更","words":50.1,"genre":["衍生","无女主"],"summary":"主角：西弗勒斯和懒羊羊  \n（刚出分，评分低）【无 cp】【温情向】【弥补遗憾】\n当羊村的懒羊羊变成了西弗勒斯家的小羊，拥有魔法的西弗勒斯和多项技能的懒羊羊进入霍格沃兹发生的故事。\n莉莉：我的姐姐管的太多了\n懒羊羊：手艺好的姐姐，品性是不会差到哪里去的！遇到问题要从自身身上找原因。\n掠夺四人组：讨厌的鼻涕精！\n西弗勒斯：请叫我全名，西弗勒斯·普林斯，还有，这就是纯血的教养吗？波特，小天狼星？\n邓布利多：孩子，我希望你对卢平是狼人这件事情保密，毕竟每个孩子都有学习的权利，对吗？\n西弗勒斯，懒羊羊：他当然有自由学习的权利，但前提是他的权益不会威胁到学生的人身安全，同时亲爱的校长，在你为卢平街道4人组争取权益的时候，麻烦你看一看被他们欺负的同学呢？\n————\n总体来说，文章不会很尖锐，但是个人不是很喜欢邓布利多，我认为他是一个合格的政治家，但不一定是一个合格的校长。","update":"2026-06-30T16:01:00+00:00","latest":"第283章 猫头鹰来信","rating":2,"review":"原本是很有意思的但是 AA 又 II，看不下去了（确实断更了）。","progress":"弃文","post":"2026-08-06","edit":"2026-08-07"},{"id":"9d45f71831","url":"https://fanqienovel.com/page/7645708259139013656","title":"琴酒他罢工摆烂了","cover":null,"author":"碧落婆婆","status":"连载","words":32.4,"genre":["衍生","轻松"],"summary":"琴酒：休假摆烂中，走开，别来烦我！\n柯南：这个名叫夏洛克・莫里亚蒂，长相却酷似琴酒的男人，到底是谁？\n波本 & 黑麦etc：琴酒！…… 等等，真是琴酒？\n少年侦探团 & 警方etc：这位又帅又飒的先生，是好人！\n……\n纯黑，不洗白，无CP，谋略向，借用时事背景，对红方不友好。\n……\n(╯°□°）╯︵ ┻━┻\n转赛道的新书进展非常不顺，随便开个能让我换换心情的故事。\n临时开书解压，更新随缘，请佛系追更。","update":"2026-08-13T16:01:00+00:00","latest":"第153章 这件事要从很早之前说起","rating":4,"review":"阴阳怪气自然好看……偶有段落有 AI 感不过还算无伤大雅。","progress":"追读","post":"2026-08-03","edit":"2026-08-03"},{"id":"e3741dc00a","url":"https://fanqienovel.com/page/7645683516113423384","title":"三角洲：赛伊德入侵我家？","cover":null,"author":"qazwsj","status":"连载","words":43.5,"genre":["衍生","穿越","轻松"],"summary":"【主要写三角洲世界】+【来回穿越】+【非直播，无女主】\n（为了流畅度略微修改剧情）\n出租屋马桶突发诡异异变！\n赵凯文傻眼。\n赛伊德，居然顺着自家马桶爬进现实世界！\n靠着双向传送门互通两界，赵凯文上线刷枪给大坝输送弹药，赛伊德线下特训身手。\n曼德尔砖化作数据流涌入体内，觉醒复制所有干员专属技能的顶级能力！\n硝烟笼罩整片阿萨拉，各方势力互相算计缠斗不休。\n昔日脆皮大学生，已然能直面枪林弹雨，与赛伊德并肩作战！\n阿萨拉每一处战场，都留下这对跨次元搭档的身影！\n“我叫赵凯文，阿萨拉的一把刀……”\n其实雨也没多大！是风在拼命刮！","update":"2026-08-13T00:54:00+00:00","latest":"第210章 顺着网线（60|75）","rating":3,"review":"微 AI，先看着。","progress":"追读","post":"2026-08-01","edit":"2026-08-06"},{"id":"a57c8713ae","url":"https://fanqienovel.com/page/7631418979428355097","title":"我在战锤抽词条，帝皇站起来了？","cover":null,"author":"忠不可言呐","status":"连载","words":65.4,"genre":["衍生","系统","穿越","星际"],"summary":"本文又名：我是你爹。【男主无 cp😁➕哆啦 A 梦童年漫主角😁➕人类无敌😁】\n“我穿越了。战锤40k。不知道哪个星球，应该是一个沦陷区废弃巢都底层洞穴，混沌邪物不断闪烁，周围还有混沌信徒在巡逻。系统给我第一个词条，【手电筒】。对，不是激光枪，是特么的手电筒。帝皇啊，你在吗？”\n一开始其实我挺慌的，直到我摇出了这五个能力。\n1，三十日【与任何敌人交战都能撑过 30 天】。\n2，免疫灵能但自身可使用灵能。\n3，超级灵能【将灵能提升至极限】。\n4，短暂屏蔽虫巢意识【可根据灵能强度控制一定数量泰伦生物】。\n5，让帝皇以巅峰状态离开王座且不会成神。\n……不是，什么？等下？你说什么？？你说我能干嘛？？？？\n原来我是人类的外挂。【确信】\n*\n亚空间那四个你们给我等着，挨个儿点名，不留活口。还有你们，外边那一群，太空死灵，灵族，兽人，钛，你们都给我等着。还有你，泰伦虫族，没说你是不？\n“不知道啊，什么人类低谷？什么黑暗世界？我只是个什么都不懂的外挂，有什么话你们和站起来的帝皇说去吧。”\n*\n：集合，打架了。\n：你还指挥上了。\n：刚刚帝皇站起来了。\n：打谁，打哪里？！\n：打！都打！上！都上！\n*\n没看过战锤也能看","update":"2026-08-13T16:21:00+00:00","latest":"第265章 我们怎么能是野蛮人呢？","rating":5,"review":"超级爽文，并且磕牢 E 磕爽了。","progress":"追读","post":"2026-07-13","edit":"2026-08-07"},{"id":"b524b6317a","url":"https://fanqienovel.com/page/7527399805383871512","title":"种田？种出个长生久视逍遥自在！","cover":null,"author":"书茄4096","status":"连载","words":89.1,"genre":["东方仙侠","玄幻","奇幻仙侠","穿越"],"summary":"【真-种田流】【繁华修仙界】【凡人流】【开局就修仙】【草木妖人】\n好消息，身穿修仙界！还是和平繁荣的修仙坊市地区！可以创业发财了！\n坏消息，玻璃，火药，肥皂全都卖不动！可乐拐骗圣女，烤肉诱惑魔兽也，行不通！修仙世界生产力为什么这么高！\n买辟谷丹送不锈钢盆是为啥啊！什么？是因为宗门长辈炼玄铁的时候顺手炼了一个湖那么多的钢铁？\n幸好，还可以去种地。\n种地？种！从灵植师开始种出个长生久视，逍遥自在！","update":"2026-08-13T14:35:00+00:00","latest":"第404章 我们这里不让要饭","rating":4,"review":"经常幽我一默。","progress":"追读","post":"2026-05-09","edit":"2026-08-09"},{"id":"6627d74a3a","url":"https://fanqienovel.com/page/7595176537033296958","title":"什么是逗包流御兽师啊？","cover":null,"author":"鲁尼克斯","status":"停更","words":37.9,"genre":["都市高武","都市","穿越","宠物","天才"],"summary":"(升级流，天才流，武侠和御兽，慢节奏)这是御兽为主流的平行世界。\n动物、植物、元素灵、机器生命······电系、风系、空间系······宠兽们掌握各种能力，人类能通过契约与御兽建立起联系，一同修炼，掌握超凡。\n周禄带着前世记忆从小在这长大，可却发现这个世界比他前世更吃投胎技术，贫穷的家庭一家人不吃不喝都难以养好一只宠兽，而且人类也时刻面临在异兽的挑战。\n但好在他发现前世的ai助手逗包在自己脑海中觉醒，依靠逗包强大的数据分析能力，周禄对御兽知识一看就会，手到擒来，发掘几百年都未被人发现的宠兽潜力，研发新的进化路线，乃至影响整个世界。\n而异兽们的本世界强大无比，古老悠远的沉寂龙冢，元素的乐园——浮海精灵岛，机械生命的帝国——珈兰德之都······而周禄将带着逗包为了文明而探索其神秘。\n（前面剧情有点慢，作者想把世界观写好点）\n来和豆包一起开启御兽之旅吧！御兽师！","update":"2026-03-31T15:10:00+00:00","latest":"第149章 规划","rating":3,"review":"开局还不错吧番茄多久才算断更啊……","progress":"弃文","post":"2026-04-05","edit":"2026-08-09"},{"id":"0f7b041bc6","url":"https://fanqienovel.com/page/7395520779909090329","title":"阿勒泰恐怖专线","cover":null,"author":"羊开泰","status":"连载","words":142.1,"genre":["灵异","轻松","第一人称","悬疑"],"summary":"【搞笑】【探险】【武力靠变异】\n吴燕青是一个来往阿勒泰专线的半吊子领队，加上一个光头司机和半路出家的摄影师，领着一头大屁股羊，三个大男人为了赚钱，节操是可以不要的，线路是非常诡异的。\n亲爱的旅客朋友们，接下来的景点有：可可托海深山中的悬尸巨树、矿脉地下的诡异生物、哈巴河的无名鬼庙……\n某些人表面上是专业旅行社，暗地里却干着业余雇佣兵的活儿。\n吃瓜群众：“有人听说过那家只有三个人的旅行社没？据说去哪儿哪儿死人，人送外号‘阿勒泰恐怖专线’！”","update":"2026-07-29T21:01:00+00:00","latest":"第153章 漩涡","rating":5,"review":"太好看了朋友。虽然觉得现代背景写灵异怪怪的但事实证明写得好吊打一切。","progress":"追读","post":"2026-03-24","edit":"2026-08-09"},{"id":"acea9909b0","url":"https://fanqienovel.com/page/7410276865048333337","title":"让你代管废材班，怎么成武神殿了","cover":null,"author":"向阳的心","status":"连载","words":461.9,"genre":["都市高武","都市","系统"],"summary":"【群像+前期慢热养成+伪迪化+搞笑+师生情（中后期才起飞，不喜勿入）】\n半个月撵走三个班主任。\n面对有着人均混世魔王，武道顶级废材的高一五班。\n即使教务主任开出极高的待遇，却无人接管。\n恰在这时，苏阳激活名师指导。\n于是毛遂自荐，成为五班新的班主任，从零开始打造世界最强武神殿。\n然而，苏阳一番指点之后，逐渐陷入了沉默。\n盘龙神拳诀咋还玩起了绣花针！？\n撼地腿怎么成天残脚了！？\n当妖兽浪潮入侵世界，外敌欲再犯我华夏之时。\n苏阳毅然挺身而出。\n“我五班学子何在？”\n早已经成为顶级武神的各学子纷至沓来……","update":"2026-08-13T09:37:00+00:00","latest":"第1940章 出大事了！","rating":4,"review":"老师专业户，上一本是现实世界观，一个班五十几个人说是写不下去了（看了一点微破防没看下去）。","progress":"追读","post":"2026-01-07","edit":"2026-08-08"},{"id":"865c73c5b4","url":"https://fanqienovel.com/page/7614322676118604862","title":"你们听我解释，我真不是恋物癖！","cover":null,"author":"睡个饱觉觉","status":"连载","words":61.2,"genre":["都市","穿越"],"summary":"【克系超凡】【不无脑】【不套娃】【不模板化】\n“这个世界的超凡者都不太正常。”\n李义忧心忡忡：“可以说都是疯子，【欢愉】放纵，【光明】偏执，至于【自然】，那简直人不人鬼不鬼，还不如【死亡】！”\n有人疑惑举手：“可我听说，你到处打探各种秘密，也有点不太对劲。”\n李义怒而三连：“不是我干的，根本没这回事，你血口喷人。”\n“我只是，无意间听到了一些东西。”\n他看着和自己说话的路灯、雕像、房子…河流…太阳…轻轻叹了口气：\n“还有，我真的很讨厌超凡者。”\n……\n这是一个超凡显世，人尽疯狂的世界。\n这是一个初入电气，城邦林立的世界。\n历史的变迁迷雾重重，有关神灵的秘密深埋于余烬之中…\n李义推开一扇门，到这个世界，赫然发觉，这个世界病得不轻。\n那还说什么，来，我帮你治病！","update":"2026-08-13T16:02:00+00:00","latest":"第247章 被“小丑”搭救之人","rating":4,"review":"上一本追过来的目前不错。","progress":"追读","post":"2025-11-17","edit":"2026-08-09"},{"id":"c22d684beb","url":"https://fanqienovel.com/page/7486442171579501630","title":"我这个邪神可太正了！","cover":null,"author":"睡个饱觉觉","status":"完结","words":153.1,"genre":["都市高武","都市","穿越","克苏鲁","魂穿"],"summary":"【这是一个癫狂的世界！】【克苏鲁向】【小心，本文带有极其强烈的精神污染，谨慎观看。】\n某天，世界迎接来巨变！\n所有的生物受到未知影响，发生异变。\n甚至…不止是生物。\n人类文明被迫龟缩于最后的十九座堡垒城市。\n向各种各样的神灵祈求庇护与恩赐，在这绝望的世界艰难挣扎。\n孟毅于一场仪式中来到这个世界，醒来后愕然发现：\n“我…是神灵？”\n开什么玩笑，哪有这么弱的神灵，搞错了吧？\n来不及细想，很快，他便发现…\n别管自己神不神的了…\n这破世界，多少沾亿点邪门…\n“搞了半天，破世界只有我一个正常人？\n不行，我不能接受！”","update":"2026-03-02T16:38:00+00:00","latest":"番外 番外二 一些新的方向","rating":4,"review":"好看的，超爱大仲裁和拂晓裁决！作者擅长描写颠人。最后结局相对来说有点上不上去。","progress":"看完","post":"2025-10-16","edit":"2026-08-09"},{"id":"bf23c62ace","url":"https://fanqienovel.com/page/7350664198612864024","title":"王耀的宝可梦之旅","cover":null,"author":"猫猫想混口饭吃而已","status":"连载","words":110.4,"genre":["衍生","穿越","宠物","神奇宝贝"],"summary":"因为喜欢无印篇的气氛，所以内容也偏向于无印篇的剧情。\n没有强力的系统、没有枯燥的游戏数据、也没有黑暗的世界背景，我要的——就是原版美金的味道！\n……\n故事的一切，要从火箭队小头目王耀踏上飞机开始说起~\n至于火箭队的飞机嘛……\n这可有的聊了。","update":"2026-08-11T15:51:00+00:00","latest":"第463章 遗迹迷！与属性石板！","rating":5,"review":"温馨可爱特别会写的……","progress":"追读","post":"2025-09-05","edit":"2026-08-08"},{"id":"cda9b63be8","url":"https://fanqienovel.com/page/7601074108775795774","title":"我手机里有个柯南世界","cover":null,"author":"张亚里","status":"完结","words":35.8,"genre":["衍生","系统","穿越","单女主"],"summary":"云夏手机上出现了一个 APP，能以灰原哀为中心观察名侦探柯南世界。\n他可以跟灰原哀对话、短暂穿越并且来回携带物品。\n这个发现瞬间点燃了癌症末期患者的求生欲。\n“很好！我有情报，你有药，我们各取所需！”\nFBI？酒厂？你们打出狗脑子都跟我没关系！\n我的寿命只有一年了啊！一年！\n谁敢妨碍药物研究，我的游戏商城军火库将奉陪到底！\n【单女主灰原哀，双向救赎，不拆 CP，开局向小哀自曝穿越，对其他人隐瞒】","update":"2026-05-06T01:55:00+00:00","latest":"第155章 治愈癌症，震惊全球","rating":4,"review":"追完了的，作者每次看起来都像烂尾但细品别有一番风味（？\n这篇也没有强调那种黏黏糊糊的感情，两人都得到各自所求。","progress":"看完","post":"2025-06-05","edit":"2026-08-09"},{"id":"6a0a12054c","url":"https://fanqienovel.com/page/7476655274191752216","title":"我在柯南世界修仙","cover":null,"author":"张亚里","status":"完结","words":21.8,"genre":["衍生","系统","无敌","单女主"],"summary":"【开局无敌+日常+乐子人+单女主灰原哀+不拆新兰】\n“灰原哀，我要你给我造长生不老药！”云吹雪就这样出现在了一脸懵圈的小哀面前。\n作为修仙者，他是意外被传送到柯南世界的。\n他以为这里就是自己红尘历练的“下界”，系统赠送的漫画被当成了“史书”和“预言书”。\n世界高层都见识过云吹雪秒杀现代军队的恐怖实力，却不约而同选择了隐瞒。\n在地球体验生活的他总是用修仙界的思维去做事，让红黑阵营都感觉自己的三观崩塌了。","update":"2025-04-16T00:00:00+00:00","latest":"第94章 离开？还是留下来？","rating":3,"review":"其实没有印象但记录上是看完了的！回头扫一下看看吧。","progress":"看完","post":"2025-05-20","edit":"2026-08-09"},{"id":"8666d7db6c","url":"https://fanqienovel.com/page/7265950065439542307","title":"柯南之超能力大魔王","cover":null,"author":"张亚里","status":"完结","words":105.1,"genre":["衍生","穿越","单女主"],"summary":"【单女主灰原哀】\n身为超能力者，夜月在名侦探世界努力扮演普通人。只要遇见不同角色，他就可以使用不同的超能力，所以他立志广交朋友。\n他是小兰园子的救命恩人，少年侦探团的老大哥，阿笠博士的忘年之交，宫野志保的合作伙伴，怪盗基德的师兄。\n安室透表示：“他是最大帮派泥参会的供奉，代号魔王，为了方便调查他，我选择在黑帮兼职。”\n琴酒表示：“这家伙比赤井秀一更可怕，必须由我来打败，你们谁都不许动手！”\n夜月觉得他们想多了，我只是想和他们交个朋友而已。","update":"2024-06-19T00:01:00+00:00","latest":"第491章 终于见到你了，妈妈……","rating":4,"review":"补录，有些忘了。\n总体喜欢！颇具幽默，作者是哀女主专业户，本文的一则亮点是给了哀原生家庭温暖。","progress":"看完","post":"2025-05-10","edit":"2026-08-09"},{"id":"bec79d154c","url":"https://fanqienovel.com/page/7365917941222607896","title":"我于末世登神，顺便拯救人类","cover":null,"author":"蒸汽饭桶","status":"完结","words":104.6,"genre":["都市高武","都市","系统","无女主","都市异能"],"summary":"（已完结）【登神】+【幕后流】+【都市异能】+【群像】+【无女主】+【*前期渗透发育中期夺权揭秘后期登台决战】\n游戏文本策划林清流在参加完组内庆功宴后成功撞了大运来到了另一个世界：\n陨石？什么陨石？\n什么叫人类只剩下一座城了外面全是异兽？\n还没搞清楚状况的林先生发现和自己一同穿越而来的U盘成为了自己的金手指系统，而其中存储的设定废稿似乎也和这个世界产生了奇异的碰撞......\n“诶？我成神吗？真的假的......”\n只要培养信徒就能获得强大的力量，还有这种割韭菜的好事？\n在这个进入了毁灭倒计时的世界，白手起家的神明预备役选择踏上登神之途，顺便将这个有点离谱的世界拯救。\n只是在此之前......神明的屋顶也要自己补......\n一个神明，布道者，裱糊匠“三位一体”的故事......\n“至于那些什么探索队传说，秘密警察首领，大发明家和外城区的影子教父之类的，和我一个普普通通的心理医生又有什么关系呢？”\n（作者碎碎念：1.角色戏份较平均，介意群像的朋友们慎入。2.故事总体还是偏欢乐向的，主角人性充沛到爆......3.会有一些脑洞魔改小故事，当成番外看就好，4.如果发现世界观有问题……要不再往后看看？）","update":"2025-02-07T10:08:00+00:00","latest":"番外：插班生食用指南","rating":4,"review":"追新文追到一半回头吃饭。\n\n主角上辈子是二游文案（……），穿越后获得了把自己写的废稿能力赐予别人的抛瓦（以一个虚化 U 盘形态存在），此后一直暗示代价呢？（不过结局不错。）\n\n故事时间点是几百年后，地球将亡，人类开展「蒲公英计划」，前往宇宙各个角落以求生存。一架飞船在太空遭遇外星菌群，两者皆在预定行星迫降。\n\n飞船内部政治斗争，赢家隐瞒了人类历史，在新球上当起了人上人。\n\n外星菌群是集体意识、万即是一的物种，获得了几乎所有休眠仓（含休眠者的知识）和地球生物样本，发起变异兽潮，不断进化。\n\n主角渐渐发现他们所在的星球也不正常，地壳中充满了能“夺舍”智慧生物的粘稠有机物，并且追溯历史，来到这颗星球后人类才渐渐拥有生物场和超能力。\n\n由于学习人类，菌群意志分裂了。人类与菌群决战，而主掌学习与演化的菌群意志最终发现自己是某高级物种制造的生物能转化器，存在目的即是吞噬、死亡，然后造物主会来回收星球，届时人类也会 GG。\n\n决战人类胜利，主角和菌群最高意志达成协议，三位最高意志自杀或被俘，但是其演化的地球物种会和人类共存。\n\n主角把自己的金手指丢进地壳中，与行星意识展开了对话，原来整个行星是一个飞升成神的存在留下的躯壳，躯壳选择了主角作为自己新的意识，全文完。","progress":"看完","post":"2025-03-20","edit":"2026-08-09"},{"id":"141007f085","url":"https://fanqienovel.com/page/7472417299962547224","title":"第四天灾：我的玩家重铸秩序","cover":null,"author":"蒸汽饭桶","status":"连载","words":268.3,"genre":["游戏","系统","穿越","无女主","灵气复苏"],"summary":"【第四天灾】【欢乐向】【无女主】【西幻领主种田】【慢热】\n“将一团血肉、几根碎骨、大半个完整的大脑用藤蔓相互链接，加点来自异世界的灵魂，就能创造出‘玩家’——一种神奇的核动力驴！”\n“当然，我更喜欢叫他们‘拼好人’。”\n穿越畸变异世界的埃德靠着自己的伴生能力从老家召唤来了一些玩家为自己打工，就在他打算借此躺平的时候却发现自己的玩家们开始越来越不对劲了……\n“什么叫你们的世界被侵蚀了？”\n“这里的技能现实中也能用是什么意思？”\n“那几个国家，不要再派特工来学艺了，我真不是什么赛博教官！”\n“这秩序之主的位置如何使得？哎呀，你们，你们这是害苦了我啊……”\n（入侵现实剧情设定偏后，前中期以游戏为主，少量现实部分铺垫~）","update":"2026-08-13T04:00:00+00:00","latest":"第1298章 护堡骑士想要进步","rating":5,"review":"积极而风趣，挑点小刺就是现实比重是不是有点太太太小了。","progress":"追读","post":"2025-03-13","edit":"2026-08-08"}];
